name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install setuptools==80.9.0
          python -m pip install --no-build-isolation .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir /tmp/wheels
      - name: Install the built release artifact
        run: python -m pip install --force-reinstall --no-deps /tmp/wheels/repo_doctor_ai-0.2.0-py3-none-any.whl
      - name: Smoke-test the installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: repo-doctor --version
      - name: Self-audit
        run: repo-doctor scan . --format json --output /tmp/self-audit.json --fail-on critical
      - name: Synthetic demo
        run: repo-doctor scan examples/sample-repo --config examples/repo-doctor.json --fail-on high
      - name: SARIF generation
        run: repo-doctor scan examples/sample-repo --config examples/repo-doctor.json --format sarif --output /tmp/repo-doctor.sarif --fail-on high
      - name: HTML and SBOM generation
        run: |
          repo-doctor scan examples/sample-repo --config examples/repo-doctor.json --format html --output /tmp/repo-doctor.html --fail-on high
          repo-doctor sbom examples/sample-repo --config examples/repo-doctor.json --output /tmp/repo-doctor.cdx.json
      - name: Build source distribution
        run: |
          mkdir -p /tmp/sdists
          python -c "from setuptools.build_meta import build_sdist; build_sdist('/tmp/sdists')"
      - name: Install the built source distribution
        run: python -m pip install --force-reinstall --no-deps --no-build-isolation /tmp/sdists/repo_doctor_ai-0.2.0.tar.gz
      - name: Smoke-test the installed sdist outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          repo-doctor --version
          repo-doctor scan "${{ github.workspace }}/examples/sample-repo" --config "${{ github.workspace }}/examples/repo-doctor.json" --format json --output /tmp/sdist-smoke.json --fail-on high
          repo-doctor sbom "${{ github.workspace }}/examples/sample-repo" --config "${{ github.workspace }}/examples/repo-doctor.json" --output /tmp/sdist-smoke.cdx.json
