name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests
      - name: Self-audit
        run: repo-doctor scan . --format json --output /tmp/self-audit.json --fail-on critical
      - name: Synthetic demo
        run: repo-doctor scan examples/sample-repo --config examples/repo-doctor.json --fail-on high
      - name: SARIF generation
        run: repo-doctor scan examples/sample-repo --config examples/repo-doctor.json --format sarif --output /tmp/repo-doctor.sarif --fail-on high

